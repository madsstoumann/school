<style>
/* Layout: et roligt bibliotek. Kapitler som rækker, hvert emne som et kort med sit eget lille kredsløbsikon og sin egen farve. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --fg: #17211c; --muted: #56645c; --line: #d5ded8;
  --n: #3557b7; --c: #2f6f4a; --p: #b8651a; --brand: #2f6f4a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111814; --surface: #19221d; --fg: #e6ede8; --muted: #9fb0a6; --line: #2c3a32; --n: #8fa9ff; --c: #7fd3a0; --p: #f2a964; --brand: #7fd3a0; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #111814; --surface: #19221d; --fg: #e6ede8; --muted: #9fb0a6; --line: #2c3a32; --n: #8fa9ff; --c: #7fd3a0; --p: #f2a964; --brand: #7fd3a0; color-scheme: dark; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 48px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.1; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 6vw, 3.8rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; }
p { margin: 0; }
header { display: grid; gap: 12px; }
.lede { font-size: 1.2rem; max-width: 56ch; color: var(--muted); }
#chapters { display: grid; gap: 56px; }
.chapter { display: grid; gap: 16px; }
.chapter .ch { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
a.card {
  --a: var(--brand);
  display: grid; grid-template-rows: auto auto 1fr; gap: 10px; padding: 20px; border-radius: 18px;
  background: var(--surface); border: 1.5px solid var(--line); color: inherit; text-decoration: none;
  transition: transform .15s, border-color .15s;
}
a.card:hover { transform: translateY(-3px); border-color: var(--a); }
a.card:focus-visible { outline: 3px solid var(--a); outline-offset: 3px; }
a.card h3 { font-size: 1.35rem; color: var(--a); }
a.card p { color: var(--muted); }
a.card svg { width: 64px; height: 64px; }
a.card svg circle { fill: none; stroke: var(--a); stroke-width: 4; stroke-dasharray: 34 10; }
a.card svg path { fill: var(--a); }
a.card svg text { fill: var(--a); font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.how { font-size: .9rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
@media (prefers-reduced-motion: reduce) { a.card { transition: none; } }

/* Orddeling: browserens danske ordbog (stavelser), min. 10 tegn og 4 tegn på hver side. Bløde bindestreger i lange titelord dækker browsere uden dansk ordbog. */
h1, h2, h3, p, li, .card, a { hyphens: auto; -webkit-hyphens: auto; hyphenate-limit-chars: 10 4 4; -webkit-hyphenate-limit-before: 4; -webkit-hyphenate-limit-after: 4; overflow-wrap: break-word; }
</style>

<style>.back { color: var(--brand); font-weight: 700; text-decoration: none; justify-self: start; } .back:hover { text-decoration: underline; }</style>
</head>

  const M = new Map();
  for (const w of W) {
    const sep = w.includes('/') ? '/' : '|'; const p = w.replace(/[|/]/g, ''); let out = '', pos = 0;
    for (const part of w.replace(sep == '/' ? /\|/g : /\//g, '').split(sep)) { if (out && pos >= 4 && p.length - pos >= 4) out += '\u00AD'; out += part; pos += part.length; }

  window.hy = root => { const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('svg,script,style') ? 2 : 1 }); let n; while ((n = tw.nextNode())) { const t = n.nodeValue.replace(re, w => M.get(w) || w); if (t !== n.nodeValue) n.nodeValue = t; } };
})();
