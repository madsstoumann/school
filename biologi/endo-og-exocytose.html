<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endo- og exocytose</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: kort over de fire bidder øverst, derefter én stor tegning, der bygges op trin for trin, og en fortæller-boks under den. */
:root {
  --bg: #f2f5f3; --surface: #ffffff; --fg: #17211c; --muted: #56645c; --line: #d5ded8;
  --accent: #3d7f2e; --accent-soft: #e3f0dc;
  --leaf: #4f9a3a; --leaf-soft: #cfe6c4; --sun: #e0a100; --sun-soft: #fbedc4;
  --water: #2f7fc1; --water-soft: #d6e8f6; --hplus: #d0582a; --electron: #7b4bc4;
  --carbon: #26302b; --air: #c2412f; --membrane: #b9d3a8; --stroma: #eef6e7; --lumen: #fbeee4;
  --node: #ffffff; --node-line: #b9c6bf;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #19221d; --fg: #e6ede8; --muted: #9fb0a6; --line: #2c3a32;
    --accent: #8fd67a; --accent-soft: #1e2f1a;
    --leaf: #7cc766; --leaf-soft: #22391c; --sun: #f5c542; --sun-soft: #3a3115; --water: #6fb3ea; --water-soft: #15293a;
    --hplus: #ff8f63; --electron: #b896f2; --carbon: #e6ede8; --air: #ff7d6b; --membrane: #3c5530; --stroma: #172315; --lumen: #2e2118;
    --node: #1e2924; --node-line: #3d4e45; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #19221d; --fg: #e6ede8; --muted: #9fb0a6; --line: #2c3a32;
  --accent: #8fd67a; --accent-soft: #1e2f1a;
  --leaf: #7cc766; --leaf-soft: #22391c; --sun: #f5c542; --sun-soft: #3a3115; --water: #6fb3ea; --water-soft: #15293a;
  --hplus: #ff8f63; --electron: #b896f2; --carbon: #e6ede8; --air: #ff7d6b; --membrane: #3c5530; --stroma: #172315; --lumen: #2e2118;
  --node: #1e2924; --node-line: #3d4e45; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.6rem; } h3 { font-size: 1.1rem; }
p { margin: 0; }
.back { color: var(--accent); font-weight: 700; text-decoration: none; justify-self: start; }
.back:hover { text-decoration: underline; }
header { display: grid; gap: 14px; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.lede { font-size: 1.2rem; max-width: 62ch; }

/* Kort over bidderne */
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.map a { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; font-size: .9rem; min-width: 0; }
.map a b { font-family: var(--font-display); color: var(--fg); font-size: 1rem; }
.map a.here { border-color: var(--accent); background: var(--accent-soft); }
.map a.here b { color: var(--accent); }
.map a:hover { border-color: var(--accent); }
@media (max-width: 620px) { .map { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.fact { border-left: 4px solid var(--accent); padding-left: 14px; display: grid; gap: 6px; }
.fact .v { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--accent); }
.fact .src { font-size: .8rem; color: var(--muted); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 8em 1fr; gap: 10px; align-items: center; font-size: .9rem; }
.bar .track { height: 14px; border-radius: 7px; background: var(--accent-soft); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 7px; background: var(--accent); }

/* Tegning */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; }
.scroll { overflow-x: auto; }
.scroll svg { display: block; width: 100%; min-width: 680px; height: auto; }
svg text { font-family: var(--font-body); fill: var(--fg); font-size: 14px; }
svg .t { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
svg .small { font-size: 12px; fill: var(--muted); }
svg .b { font-weight: 700; }
[data-s] { transition: opacity .3s; }
.dim [data-s]:not(.on) { opacity: .22; }
.on .glow, .on.glow { filter: drop-shadow(0 0 6px var(--sun)); }
.flow { stroke-dasharray: 8 7; }
.on .flow, .on.flow { animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -30; } }
.spin { transform-box: fill-box; transform-origin: center; }
.on .spin { animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hint { font-size: .88rem; color: var(--muted); padding: 10px 18px 0; }
.story { display: grid; gap: 12px; padding: 18px; border-top: 1px solid var(--line); background: var(--accent-soft); margin-top: 12px; }
.story-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.story h3 { font-size: 1.35rem; }
.story p { max-width: 70ch; }
.story .img { font-style: italic; color: var(--muted); }
.count { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); }
.btns { display: flex; gap: 8px; }
button { font: inherit; font-weight: 700; border: 1.5px solid var(--accent); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
button:hover { background: var(--accent); color: var(--surface); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--surface); }
.dots button.on { background: var(--accent); }

.section { display: grid; gap: 16px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; cursor: pointer; }
.steps li.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.steps .n { font-family: var(--font-display); font-weight: 800; font-size: .85rem; color: var(--accent); }
.steps .img { font-size: .92rem; color: var(--muted); font-style: italic; }
.remember { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 12px; }
.remember ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.words { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 24px; }
.words div { display: grid; gap: 2px; border-left: 4px solid var(--accent); padding-left: 12px; }
.words b { font-family: var(--font-display); }
.words span { color: var(--muted); font-size: .95rem; }
.quiz { display: grid; gap: 18px; }
.q { display: grid; gap: 10px; }
.q .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.q button { font-weight: 400; border-color: var(--line); }
.q button.right { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.q button.wrong { background: var(--hplus); border-color: var(--hplus); color: var(--surface); }
.q .fb { font-size: .95rem; color: var(--muted); min-height: 1.5em; }
.note { font-size: .88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Orddeling: browserens danske ordbog (stavelser), min. 10 tegn og 4 tegn på hver side. Bløde bindestreger i lange titelord dækker browsere uden dansk ordbog. */
h1, h2, h3, p, li, .card, a { hyphens: auto; -webkit-hyphens: auto; hyphenate-limit-chars: 10 4 4; -webkit-hyphenate-limit-before: 4; -webkit-hyphenate-limit-after: 4; overflow-wrap: break-word; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">← Alle emner</a>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
  </header>
  <nav class="map" id="map" aria-label="Emner i serien"></nav>

  <section class="card" aria-label="Tegning">
    <p class="hint">Tryk Næste for at bygge tegningen op, eller tryk direkte på noget i tegningen.</p>
    <div class="scroll"><svg viewBox="0 0 820 480" role="img" aria-label="Endocytose og exocytose i fire trin, og en amøbe, der spiser"><defs>
<marker id="m-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
<marker id="m-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--sun)"/></marker>
<marker id="m-water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--water)"/></marker>
<marker id="m-leaf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--leaf)"/></marker>
<marker id="m-air" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--air)"/></marker>
<marker id="m-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--electron)"/></marker>
<marker id="m-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--hplus)"/></marker>

</defs>
<text x="200" y="30" text-anchor="middle" class="t">Endocytose: ind</text><text x="620" y="30" text-anchor="middle" class="t">Exocytose: ud</text>
<g data-s="0"><path d="M40,120 L150,120 Q200,170 250,120 L360,120" style="fill:none;stroke:var(--fg);stroke-width:4"/><circle cx="200" cy="100" r="16" style="fill:var(--hplus)"/><text x="200" y="210" text-anchor="middle" class="small b">membranen buler ind</text></g>
<g data-s="1"><path d="M40,250 L180,250 Q200,250 200,250 Q200,250 220,250 L360,250" style="fill:none;stroke:var(--fg);stroke-width:4"/><circle cx="200" cy="300" r="26" style="fill:var(--sun-soft);stroke:var(--fg);stroke-width:4"/><circle cx="200" cy="300" r="16" style="fill:var(--hplus)"/><text x="200" y="350" text-anchor="middle" class="small b">en lille pose snøres af</text></g>
<g data-s="2"><path d="M460,250 L780,250" style="fill:none;stroke:var(--fg);stroke-width:4"/><circle cx="620" cy="305" r="26" style="fill:var(--sun-soft);stroke:var(--fg);stroke-width:4"/><circle cx="620" cy="305" r="16" style="fill:var(--accent)"/><path d="M620,276 L620,258" style="fill:none;stroke:var(--accent);stroke-width:3" marker-end="url(#m-acc)"/><text x="620" y="350" text-anchor="middle" class="small b">en pose med indhold</text><text x="620" y="366" text-anchor="middle" class="small b">bevæger sig ud mod membranen</text></g>
<g data-s="3"><path d="M460,120 L570,120 Q620,70 670,120 L780,120" style="fill:none;stroke:var(--fg);stroke-width:4"/><circle cx="620" cy="70" r="16" style="fill:var(--accent)"/><text x="620" y="160" text-anchor="middle" class="small b">posen åbner sig: indholdet slippes ud</text></g>

<g data-s="4"><circle cx="140" cy="410" r="12" style="fill:var(--sun-soft);stroke:var(--fg);stroke-width:2"/><circle cx="140" cy="410" r="6" style="fill:var(--hplus)"/><text x="330" y="422" text-anchor="start" class="small">omslutter føden: fødevakuole</text></g>
<g data-s="5"><circle cx="270" cy="430" r="9" style="fill:none;stroke:var(--water);stroke-width:2.5"/><text x="330" y="444" text-anchor="start" class="small">pumper vand og affald ud</text></g>
</svg></div>
    <div class="story" aria-live="polite">
      <div class="story-head">
        <div><div class="count" id="count"></div><h3 id="st-title"></h3></div>
        <div class="btns"><button id="prev" type="button">← Forrige</button><button id="next" type="button">Næste →</button></div>
      </div>
      <p id="st-text"></p>
      <p class="img" id="st-img"></p>
      <div class="dots" id="dots"></div>

    <h2>Alle trin på én gang</h2>
    <ol class="steps" id="steps"></ol>
  </section>

    <h2>Set i bogen</h2>
    <div class="facts" id="facts"></div>

    <h2>Ord, du møder</h2>
    <div class="words" id="words"></div>

<script>
const D = {"title": "Endo- og exocytose", "lede": "Nogle ting er alt for store til at gå gennem en kanal. Så bruger cellen hele membranen: den kan slå en pose om noget og trække det ind, eller åbne en pose og spytte indholdet ud.", "story": [{"title": "Membranen buler ind", "text": "Når cellen vil optage noget stort, buler membranen ind omkring det.", "img": "Som at trykke en finger ind i en ballon."}, {"title": "En pose snøres af", "text": "Membranen lukker sig om stoffet, og der dannes en lille pose (vesikel) inde i cellen. Det hedder endocytose: ind i cellen.", "img": "Endo = ind."}, {"title": "En pose på vej ud", "text": "Cellen pakker stoffer, fx hormoner eller enzymer, i små poser, som bevæger sig ud mod membranen.", "img": "Pakker på vej til posthuset."}, {"title": "Posen åbner sig", "text": "Posen smelter sammen med membranen, og indholdet bliver sluppet ud. Det hedder exocytose: ud af cellen.", "img": "Exo = ud."}, {"title": "Amøben spiser", "text": "En amøbe er en encellet organisme. Den omslutter føden og laver en fødevakuole, hvor føden bliver fordøjet.", "img": "Endocytose i praksis."}, {"title": "Og skiller sig af med vand", "text": "En kontraktil vakuole pumper overskydende vand og affald ud.", "img": "Cellens lille lænsepumpe."}], "words": [["Endocytose", "Cellen optager stof ved at slå en pose om det."], ["Exocytose", "Cellen udskiller stof ved at åbne en pose mod ydersiden."], ["Vesikel", "Lille pose af membran."]], "remember": ["<b>Endo = ind, exo = ud.</b>", "<b>Hele membranen bruges</b> som en pose."], "quiz": [{"q": "Hvad hedder det, når cellen udskiller et hormon i en pose?", "o": ["Endocytose", "Exocytose", "Osmose"], "a": 1, "why": "Exo betyder ud."}], "note": "Kilde: <i>Biologi i fokus</i>, Nucleus Forlag 2009: figur 8 (endocytose og exocytose) og 9 (amøben optager føde).", "no": 4, "series": {"name": "Cellen", "items": [["cellens-byggesaet.html", "Cellens byggesæt", "Fire slags celler"], ["cellemembranen.html", "Cellemembranen", "En væg af tændstikhoveder"], ["transport-over-membranen.html", "Transport", "Ned ad bakke eller op"], ["endo-og-exocytose.html", "Endo- og exocytose", "Cellen spiser og spytter ud"], ["bakteriens-cellevaeg.html", "Bakteriens cellevæg", "Gram-positiv og -negativ"], ["celledeling.html", "Celledeling", "Mitose og meiose"]]}, "facts": []};
const $ = id => document.getElementById(id);
$('h1').innerHTML = D.title; $('lede').innerHTML = D.lede;
const MAP = D.series.items;
$('eyebrow').textContent = `${D.series.name} · ${D.no} af ${MAP.length}`;
$('map').innerHTML = MAP.map(([f, t, s], i) => `<a href="${f}" class="${i + 1 === D.no ? 'here' : ''}"${i + 1 === D.no ? ' aria-current="page"' : ''}><b>${i + 1}. ${t}</b>${s}</a>`).join('');
const svg = document.querySelector('.scroll svg');
const story = D.story; let cur = 0;
$('dots').innerHTML = story.map((s, i) => `<button type="button" aria-label="Trin ${i + 1}" data-i="${i}"></button>`).join('');
$('dots').querySelectorAll('button').forEach(b => b.onclick = () => go(+b.dataset.i));
$('steps').innerHTML = story.map((s, i) => `<li data-i="${i}"><div class="n">Trin ${i + 1}</div><h3>${s.title}</h3><p>${s.text}</p>${s.img ? `<p class="img">${s.img}</p>` : ''}</li>`).join('');
document.querySelectorAll('#steps li').forEach(li => li.onclick = () => { go(+li.dataset.i); svg.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
svg.querySelectorAll('[data-s]').forEach(el => {
  el.style.cursor = 'pointer';
  el.addEventListener('click', () => { const s = el.dataset.s.split(',').map(Number); go(s.includes(cur) ? s[(s.indexOf(cur) + 1) % s.length] : s[0]); });
});
function go(i) {
  cur = (i + story.length) % story.length;
  const s = story[cur];
  $('count').textContent = `Trin ${cur + 1} af ${story.length}`;
  $('st-title').innerHTML = s.title; $('st-text').innerHTML = s.text; $('st-img').innerHTML = s.img || '';
  svg.classList.add('dim');
  svg.querySelectorAll('[data-s]').forEach(el => el.classList.toggle('on', el.dataset.s.split(',').map(Number).includes(cur)));
  document.querySelectorAll('#steps li').forEach(li => li.classList.toggle('on', +li.dataset.i === cur));
  $('dots').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === cur));
}
$('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
go(0);
$('words').innerHTML = D.words.map(([w, d]) => `<div><b>${w}</b><span>${d}</span></div>`).join('');
$('remember').innerHTML = D.remember.map(r => `<li>${r}</li>`).join('');
$('quiz').innerHTML = D.quiz.map((q, qi) => `<div class="q" data-q="${qi}"><h3>${qi + 1}. ${q.q}</h3><div class="opts">${q.o.map((o, oi) => `<button type="button" data-o="${oi}">${o}</button>`).join('')}</div><p class="fb"></p></div>`).join('');
document.querySelectorAll('.q').forEach(qe => {
  const q = D.quiz[+qe.dataset.q];
  qe.querySelectorAll('button').forEach(b => b.onclick = () => {
    qe.querySelectorAll('button').forEach(x => x.classList.remove('right', 'wrong'));
    const ok = +b.dataset.o === q.a; b.classList.add(ok ? 'right' : 'wrong');
    qe.querySelector('.fb').innerHTML = (ok ? 'Rigtigt. ' : 'Ikke helt. ') + q.why;
  });
});
$('note').innerHTML = D.note;
if (D.facts && D.facts.length) {
  $('facts').innerHTML = D.facts.map(f => {
    let vis = '';
    if (f.bars) { const max = Math.max(...f.bars.map(b => b.v)); vis = `<div class="bars">${f.bars.map(b => `<div class="bar"><span>${b.l}</span><div class="track" role="img" aria-label="${b.l}"><div class="fill" style="width:${Math.max(1, b.v / max * 100)}%"></div></div></div>`).join('')}</div>`; }
    return `<div class="fact"><div class="v">${f.v}</div><p>${f.d}</p>${vis}<div class="src">${f.src}</div></div>`;
  }).join('');
} else $('facts-sec').hidden = true;

// Pæn orddeling: bløde bindestreger ved sammensætninger (/) eller ellers ved stavelser (|), mindst 4 tegn på hver side
(() => {
  const W = 'Celle/membranen Citronsyre/cyklussen Citronsyre/cyklus DNA-kopiering Elek|tro|fo|re|se Elektron/transport/kæden Energi/strømmen Fosfor/kredsløbet Gen/splejsning Kromosom/mutationer Kvælstoffets Kvælstof/nedfald Livs/cyklusser Lys/processerne Menstruations/cyklussen Menstruations/cyklus Nerve/impulsen Nerve/impulser Nerve/systemets Nerve/systemet Nerve/celler Primær/produktion Stamtavle-gåder Mi|to|kon|dri|et Mi|to|kon|dri|er|ne Hor|mo|ner|nes Hy|po|tha|la|mus Hy|po|fy|sen Me|ta|bo|lis|me Fo|to|syn|te|sen Fo|to|syn|te|se Re|spi|ra|tio|nen Re|spi|ra|tion Kvælstof/kredsløbet Kulstof/kredsløbet Kulstoffets Kul|hy|dra|ter Kul|hy|dra|ter|ne Blod/sukkeret Blod/sukker Amino/syrer Amino/syrerne Gly|ko|ly|se Gly|ko|ly|sen Kro|mo|so|mer Kro|mo|so|mer|ne Celle/deling Celle/væggen Celle/væg Bak|te|ri|er|ne Bak|te|ri|ens Ek|so|cy|to|se En|do|cy|to|se Transport/protein Transport/proteiner Sæd/celler Æg/celler Pro|te|i|ner|nes Pro|te|i|net Pro|te|i|ner Kæde/reaktion Stof/skifte Elektro/forese Gen/teknologi Fordøjelses/systemet Fordøjelsen Livs/cyklus Slægts/træ Kromosom/mutation Tarm/bakterier Mælke/sukker Mave/sækken Lever/celler Muskel/celler Muskel/fibre Hormon/kortet Post/væsenet Post/væsen Arve/anlæg'.split(' ');
  const M = new Map();
  for (const w of W) {
    const sep = w.includes('/') ? '/' : '|'; const p = w.replace(/[|/]/g, ''); let out = '', pos = 0;
    for (const part of w.replace(sep == '/' ? /\|/g : /\//g, '').split(sep)) { if (out && pos >= 4 && p.length - pos >= 4) out += '\u00AD'; out += part; pos += part.length; }
    M.set(p, out); M.set(p.toLowerCase(), out.toLowerCase());
  }
  const re = /[A-Za-zÆØÅæøå-]{9,}/g;
  window.hy = root => { const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('svg,script,style') ? 2 : 1 }); let n; while ((n = tw.nextNode())) { const t = n.nodeValue.replace(re, w => M.get(w) || w); if (t !== n.nodeValue) n.nodeValue = t; } };
})();

hy(document.body);
</script>
